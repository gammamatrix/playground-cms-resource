openapi: 3.0.3
servers:
  -
    url: 'https://api.example.com'
    description: 'Production server'
  -
    url: 'https://api.staging.example.com'
    description: 'Staging server'
  -
    url: 'https://api.dev.example.com'
    description: 'Dev server'
info:
  title: Playground CMS Resource
  description: ''
  termsOfService: ''
  # contact:
  #   email: support@example.com
  version: 73.0.0
externalDocs:
  description: ''
  url: ''
tags:
  -
    name: Page
    description: 'Manage pages in storage.'
  -
    name: Snippet
    description: 'Manage snippets in storage.'
paths:
  '/resource/cms/snippets/{id}':
    $ref: paths/snippets/id.yml
  /resource/cms/snippets:
    $ref: paths/snippets/index.yml
  /resource/cms/snippets/create:
    $ref: paths/snippets/create.yml
  '/resource/cms/snippets/edit/{id}':
    $ref: paths/snippets/edit.yml
  '/resource/cms/snippets/lock/{id}':
    $ref: paths/snippets/lock.yml
  '/resource/cms/snippets/restore/{id}':
    $ref: paths/snippets/restore.yml
  '/resource/cms/snippets/revision/{id}':
    $ref: paths/snippets/revision.yml
  '/resource/cms/snippets/{id}/revisions':
    $ref: paths/snippets/revisions.yml
  '/resource/cms/pages/{id}':
    $ref: paths/pages/id.yml
  /resource/cms/pages:
    $ref: paths/pages/index.yml
  /resource/cms/pages/create:
    $ref: paths/pages/create.yml
  '/resource/cms/pages/edit/{id}':
    $ref: paths/pages/edit.yml
  '/resource/cms/pages/lock/{id}':
    $ref: paths/pages/lock.yml
  '/resource/cms/pages/restore/{id}':
    $ref: paths/pages/restore.yml
  '/resource/cms/pages/revision/{id}':
    $ref: paths/pages/revision.yml
  '/resource/cms/pages/{id}/revisions':
    $ref: paths/pages/revisions.yml
components:
  schemas:
    Page:
      $ref: models/page.yml
    PageRevision:
      $ref: models/page-revision.yml
    Snippet:
      $ref: models/snippet.yml
    SnippetRevision:
      $ref: models/snippet-revision.yml
