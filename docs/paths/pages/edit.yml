parameters:
  -
    in: path
    name: id
    required: true
    description: 'The page id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Page
  summary: 'Edit a page form.'
  operationId: edit_page
  responses:
    200:
      description: 'The edit page information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/page.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/cms/pages/{id}">Edit a page</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
