post:
  tags:
    - Page
  summary: 'Get pages from the index using POST.'
  operationId: post_pages_index
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../requests/page/form.yml
  responses:
    200:
      description: 'Get the pages from the index.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../../models/page.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
