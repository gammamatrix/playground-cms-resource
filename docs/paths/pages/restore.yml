parameters:
  -
    in: path
    name: id
    required: true
    description: 'The page id.'
    schema:
      type: string
      format: uuid
put:
  tags:
    - Page
  summary: 'Restore a page from the trash by ID.'
  operationId: restore_page
  responses:
    200:
      description: 'The restored page.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/page.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
