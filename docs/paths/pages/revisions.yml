parameters:
  -
    in: path
    name: id
    required: true
    description: 'The page id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Page
  summary: 'Get the revisions of a page.'
  operationId: revision_index_page
  responses:
    200:
      description: 'The page revisions.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../../models/page-revision.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
