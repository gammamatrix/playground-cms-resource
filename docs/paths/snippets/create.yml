get:
  tags:
    - Snippet
  summary: 'Create a snippet form.'
  operationId: create_snippet
  responses:
    200:
      description: 'The create snippet information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/snippet.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/cms/snippets">Create a snippet</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
