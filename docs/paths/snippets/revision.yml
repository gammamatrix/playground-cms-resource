parameters:
  -
    in: path
    name: id
    required: true
    description: 'The snippet revision id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Snippet
  summary: 'Show a snippet revision by ID.'
  operationId: revision_snippet
  responses:
    200:
      description: 'The snippet revision.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/snippet-revision.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
put:
  tags:
    - Snippet
  summary: 'Restore a snippet Revision by ID.'
  operationId: restore_revision_snippet
  responses:
    200:
      description: 'The restored snippet.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/snippet.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
