parameters:
  -
    in: path
    name: id
    required: true
    description: 'The snippet id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Snippet
  summary: 'Edit a snippet form.'
  operationId: edit_snippet
  responses:
    200:
      description: 'The edit information (JSON) or form (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/snippet.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/cms/snippets/{id}">Edit a snippet</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
