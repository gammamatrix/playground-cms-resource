parameters:
  -
    in: path
    name: id
    required: true
    description: 'The snippet id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Snippet
  summary: 'Get a snippet by id.'
  operationId: get_snippet
  responses:
    200:
      description: 'The snippet data.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/snippet.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
delete:
  tags:
    - Snippet
  summary: 'Delete a snippet by id.'
  operationId: delete_snippet
  responses:
    204:
      description: 'The snippet has been deleted.'
    401:
      description: Unauthorized
    403:
      description: Forbidden
    423:
      description: 'The snippet is locked. Unlock to delete.'
patch:
  tags:
    - Snippet
  summary: 'Patch a snippet by id.'
  operationId: patch_snippet
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../requests/snippet/patch.yml
  responses:
    200:
      description: 'The snippet has been patched.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/snippet.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
    422:
      description: 'Validation error'
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                properties:
                  title:
                    type: array
                    items:
                      type: string
                      example: 'The title field is required.'
    423:
      description: 'The snippet is locked. Unlock to patch.'
