post:
  tags:
    - Snippet
  summary: 'Get snippets from the index using POST.'
  operationId: post_snippets_index
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../requests/snippet/form.yml
  responses:
    200:
      description: 'Get the snippets from the index.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../../models/snippet.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
