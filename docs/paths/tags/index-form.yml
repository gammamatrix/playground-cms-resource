post:
  tags:
    - Tag
  summary: 'Get tags from the index using POST.'
  operationId: post_tags_index
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../requests/tag/form.yml
  responses:
    200:
      description: 'Get the tags from the index.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../../models/tag.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
