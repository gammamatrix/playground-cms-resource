parameters:
  -
    in: path
    name: id
    required: true
    description: 'The tag id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Tag
  summary: 'Edit a tag form.'
  operationId: edit_tag
  responses:
    200:
      description: 'The edit tag information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/tag.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/cms/tags/{id}">Edit a tag</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
