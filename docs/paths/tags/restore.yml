parameters:
  -
    in: path
    name: id
    required: true
    description: 'The tag id.'
    schema:
      type: string
      format: uuid
put:
  tags:
    - Tag
  summary: 'Restore a tag from the trash by ID.'
  operationId: restore_tag
  responses:
    200:
      description: 'The restored tag.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/tag.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
