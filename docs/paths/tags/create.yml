get:
  tags:
    - Tag
  summary: 'Create a tag form.'
  operationId: create_tag
  responses:
    200:
      description: 'The create tag information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/tag.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/cms/tags">Create a tag</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
