get:
  tags:
    - Tag
  summary: 'Get tags from the index.'
  operationId: get_tags_index
  responses:
    200:
      description: 'Get the tags from the index.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../../models/tag.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
post:
  tags:
    - Tag
  summary: 'Create a tag.'
  operationId: post_tag
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../requests/tag/post.yml
  responses:
    200:
      description: 'The created tag.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/tag.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
    422:
      description: 'Validation error'
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                properties:
                  title:
                    type: array
                    items:
                      type: string
                      example: 'The title field is required.'
    423:
      description: 'The tag is locked. Unlock to patch.'
