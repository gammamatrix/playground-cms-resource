components:
  schemas:
    Page:
      $ref: '#/components/schemas/page'
    PageRevision:
      $ref: '#/components/schemas/page-revision'
    Snippet:
      $ref: '#/components/schemas/snippet'
    SnippetRevision:
      $ref: '#/components/schemas/snippet-revision'
    page:
      description: The CMS page model.
      type: object
      properties:
        id:
          description: The primary key.
          type: string
          format: uuid
          readOnly: true
        page_type:
          description: The page type of this page.
          type: string
          nullable: true
        created_by_id:
          description: 'Foreign key: links a created by user to this page.'
          type: string
          format: uuid
          nullable: true
        modified_by_id:
          description: 'Foreign key: links a modified by user to this page.'
          type: string
          format: uuid
          nullable: true
        owned_by_id:
          description: 'Foreign key: links an owned by user to this page.'
          type: string
          format: uuid
          nullable: true
        parent_id:
          description: 'ID: a parent of this page.'
          type: string
          format: uuid
          nullable: true
        matrix_id:
          description: 'Foreign key: links a matrix to this page.'
          type: string
          format: uuid
          nullable: true
        created_at:
          description: Denotes the date and time, the page was created.
          type: string
          format: date-time
          readOnly: true
        updated_at:
          description: Denotes the date and time, the page was last modified.
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          description: Denotes the date and time, the page was put in the trash.
          type: string
          format: date-time
          nullable: true
        canceled_at:
          description: The canceled at date for this page.
          type: string
          format: date-time
          nullable: true
        closed_at:
          description: The closed at date for this page.
          type: string
          format: date-time
          nullable: true
        embargo_at:
          description: The embargo at date for this page.
          type: string
          format: date-time
          nullable: true
        fixed_at:
          description: The fixed at date for this page.
          type: string
          format: date-time
          nullable: true
        planned_end_at:
          description: The planned end at date for this page.
          type: string
          format: date-time
          nullable: true
        planned_start_at:
          description: The planned start at date for this page.
          type: string
          format: date-time
          nullable: true
        postponed_at:
          description: The postponed at date for this page.
          type: string
          format: date-time
          nullable: true
        published_at:
          description: The published at date for this page.
          type: string
          format: date-time
          nullable: true
        released_at:
          description: The released at date for this page.
          type: string
          format: date-time
          nullable: true
        resumed_at:
          description: The resumed at date for this page.
          type: string
          format: date-time
          nullable: true
        resolved_at:
          description: The resolved at date for this page.
          type: string
          format: date-time
          nullable: true
        suspended_at:
          description: The suspended at date for this page.
          type: string
          format: date-time
          nullable: true
        timer_end_at:
          description: The timer end at date for this page.
          type: string
          format: date-time
          nullable: true
        timer_start_at:
          description: The timer start at date for this page.
          type: string
          format: date-time
          nullable: true
        gids:
          description: 'Permissions: gids'
          type: integer
          format: int64
        po:
          description: 'Permissions: po'
          type: integer
          format: int32
        pg:
          description: 'Permissions: pg'
          type: integer
          format: int32
        pw:
          description: 'Permissions: pw'
          type: integer
          format: int32
        only_admin:
          description: 'Permissions: only admin'
          type: boolean
        only_user:
