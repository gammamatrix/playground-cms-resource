openapi: 3.0.3
info:
  title: Playground CMS Resource
  description: 'Playground: Provides an API and a Blade UI for interacting with Playground CMS, a Content Management System for Laravel applications.'
  version: 74.0.0
servers:
  - url: https://api.example.com
    description: Production Server
  - url: https://api.staging.example.com
    description: Staging Server
  - url: https://api.dev.example.com
    description: Dev Server
  - url: http://localhost
    description: Local Server
tags:
  - name: Page
    description: Manage pages in storage.
  - name: Snippet
    description: Manage snippets in storage.
externalDocs:
  url: https://gammamatrix-playground.readthedocs.io/en/develop/components/cms.html
  description: 'Read the Docs: Playground CMS Packages'
paths:
  /resource/cms/pages/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: The page id.
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Page
      summary: Get a page by id.
      operationId: get_page
      responses:
        '200':
          description: The page data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/page'
                  meta:
                    type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    delete:
      tags:
        - Page
      summary: Delete a page by id.
      operationId: delete_page
      responses:
        '204':
          description: The page has been deleted.
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '423':
          description: The page is locked. Unlock to delete.
    patch:
      tags:
        - Page
      summary: Patch a page by id.
      operationId: patch_page
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/patch'
      responses:
        '200':
          description: The page has been patched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/page'
                  meta:
                    type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      title:
                        type: array
                        items:
                          type: string
                          example: The title field is required.
        '423':
          description: The page is locked. Unlock to patch.
  /resource/cms/pages:
    get:
      tags:
        - Page
      summary: Get pages from the index.
      operationId: get_pages_index
      responses:
        '200':
          description: Get the pages from the index.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/page'
                  meta:
                    type: object
        '401':
          description: Unauthorized
        '403':
