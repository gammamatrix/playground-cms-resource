  /resource/cms/pages/create:
    get:
      tags:
        - Page
      summary: Create a page form.
      operationId: create_page
      responses:
        '200':
          description: The create page information (JSON) or (HTML).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/page'
                  meta:
                    type: object
            text/html:
              schema:
                type: string
                example: <html><body><form method="POST" action="/resource/cms/pages">Create a page</form></body></html>
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /resource/cms/pages/edit/{id}:
