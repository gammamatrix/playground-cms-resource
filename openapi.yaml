                    type: object
                    properties:
                      title:
                        type: array
                        items:
                          type: string
                          example: The title field is required.
        '423':
          description: The page is locked. Unlock to patch.
  /resource/cms/pages/index:
    post:
      tags:
        - Page
      summary: Get pages from the index using POST.
      operationId: post_pages_index
      requestBody:
        content:
          application/json:
            schema:
