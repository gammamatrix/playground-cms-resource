                  meta:
                    type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /resource/cms/pages/lock/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: The page id.
        schema:
          type: string
          format: uuid
    delete:
      tags:
        - Page
      summary: Delete a page by id.
      operationId: unlock_page
